<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clara Vitória — 15 anos</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#000;font-family:Arial,sans-serif}
body{display:flex;justify-content:center;min-height:100vh}
.page{width:min(100%,560px);background:#000;min-height:100vh;text-align:center;color:#fff}
.video-wrap{position:relative;width:100%;overflow:hidden;background:#000}
video{display:block;width:100%;height:auto}
.hotspot{position:absolute;display:none;border:0;background:transparent;cursor:pointer;z-index:5}
#locationHotspot{left:28%;top:57%;width:44%;height:13%}
#giftHotspot{left:12%;top:70%;width:76%;height:18%}
.controls{padding:16px 14px 26px;background:#000}
button.link{width:100%;border:1px solid rgba(255,255,255,.55);background:#fff;color:#111;border-radius:14px;padding:13px 12px;margin:6px 0;font-size:16px;font-weight:600;cursor:pointer}
.deadline{font-size:14px;margin:14px 0 8px;color:#ddd}
.sound{font-size:13px;color:#aaa;margin-top:8px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:20;align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex}
.modal img{max-width:100%;max-height:90vh;border-radius:10px}
.close{position:fixed;top:15px;right:18px;color:#fff;font-size:32px;cursor:pointer}
</style>
</head>
<body>
<div class="page">
  <div class="video-wrap">
    <video id="inviteVideo" autoplay muted playsinline preload="auto">
      <source src="convite.mp4" type="video/mp4">
      Seu navegador não suporta vídeo.
    </video>
    <button id="locationHotspot" class="hotspot" aria-label="Abrir localização"></button>
    <button id="giftHotspot" class="hotspot" aria-label="Abrir sugestão de presente"></button>
  </div>

  <div class="controls">
    <button class="link" onclick="openLocation()">📍 Ver localização</button>
    <button class="link" onclick="openGift()">🎁 Sugestão de presente</button>
    <button class="link" onclick="openRsvp()">💌 Confirmar presença</button>
    <button class="link" onclick="addToCalendar()">📅 Salvar na agenda</button>
    <div class="deadline">Confirme sua presença até <b>17/10/2026</b>.</div>
    <div class="sound">Toque no vídeo para ativar o som, se necessário.</div>
  </div>
</div>

<div id="modal" class="modal" onclick="closeGift()">
  <span class="close">×</span>
  <img src="IMG_6566.jpeg" alt="Sugestão de presente" onclick="event.stopPropagation()">
</div>

<script>
const video = document.getElementById('inviteVideo');
const loc = document.getElementById('locationHotspot');
const gift = document.getElementById('giftHotspot');
  
  video.addEventListener('click', () => {
  video.muted = false;
  video.play();
});

function openLocation(){
  window.open('https://maps.app.goo.gl/QykNrA2tojQzGRBD7','_blank');
}
function openRsvp(){
  window.open('https://w.app/vamsly','_blank');
}
function addToCalendar(){
  const event = {
    title: 'Clara Vitória – 15 anos',
    start: '20261024T200000',
    end: '20261024T230000',
    location: 'Sítio Novo Paraíso Verde, Av. Abílio Augusto Távora, nº 22129 - Jardim Paraíso, Nova Iguaçu'
  };

  const url = 'https://calendar.google.com/calendar/render?action=TEMPLATE'
    + '&text=' + encodeURIComponent(event.title)
    + '&dates=' + event.start + '/' + event.end
    + '&location=' + encodeURIComponent(event.location);

  window.open(url, '_blank');
}
  function openGift(){
  document.getElementById('modal').classList.add('show');
}
function closeGift(){
  document.getElementById('modal').classList.remove('show');
}
video.addEventListener('timeupdate',()=>{
  const t=video.currentTime;
  loc.style.display=(t>=29.0 && t<=34.5)?'block':'none';
  gift.style.display=(t>=34.0 && t<=40.0)?'block':'none';
});
video.addEventListener('ended',()=>{
  video.currentTime=0;
  video.play().catch(()=>{});
});
</script>
</body>
</html>
